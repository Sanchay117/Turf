[package]
name = "turf"
version = "0.1.0"
description = "Turf: a real-time territory war where every move is a Solana transaction"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "turf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.2.2"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "allow" }
